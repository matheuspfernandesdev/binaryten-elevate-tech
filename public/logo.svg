<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cyan & Electric Blue Gradient -->
    <linearGradient id="btGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambient" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="250" cy="250" r="160" fill="#00f2fe" opacity="0.12" filter="url(#ambient)" />

  <g filter="url(#glow)">
    <!-- Sleek Diagonal '1' Bar -->
    <path d="M 125 365
             L 215 135
             C 220 122, 232 115, 246 115
             L 275 115
             C 292 115, 303 131, 297 147
             L 207 377
             C 202 390, 190 397, 176 397
             L 147 397
             C 130 397, 119 381, 125 365 Z"
          fill="url(#btGradient)" />

    <!-- Sleek Elliptical '0' Ring intersecting the '1' -->
    <path d="M 295 135
             C 365 135, 415 190, 415 265
             C 415 340, 365 395, 295 395
             C 225 395, 175 340, 175 265
             C 175 190, 225 135, 295 135 Z
             M 295 185
             C 252 185, 225 220, 225 265
             C 225 310, 252 345, 295 345
             C 338 345, 365 310, 365 265
             C 365 220, 338 185, 295 185 Z"
          fill="url(#btGradient)" fill-rule="evenodd" />

    <!-- Two Binary Glowing Dots representing '2' / duality -->
    <circle cx="152" cy="140" r="14" fill="#00f2fe" />
    <circle cx="410" cy="140" r="10" fill="#0066ff" opacity="0.8" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan & Electric Blue Gradient for Main Geometry -->
    <linearGradient id="btPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#00adff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Secondary Accent Gradient for Circuit Traces -->
    <linearGradient id="btAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="btGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Ambient Backlight Filter -->
    <filter id="btAmbient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Ambient background glow behind the logo -->
  <circle cx="256" cy="256" r="170" fill="#00f2fe" opacity="0.15" filter="url(#btAmbient)" />

  <g filter="url(#btGlow)">
    <!-- ================= CIRCUIT TRACES (BACKGROUND CONNECTIONS) ================= -->
    <!-- Top-left input trace with node -->
    <path d="M 60 170 L 120 170 L 150 200" fill="none" stroke="url(#btAccentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <circle cx="60" cy="170" r="7" fill="#00f2fe" />

    <!-- Top circuit header connection -->
    <path d="M 175 110 L 220 65 L 292 65 L 337 110" fill="none" stroke="url(#btAccentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="256" cy="65" r="6" fill="#00f2fe" />

    <!-- Bottom-right output trace with node -->
    <path d="M 362 312 L 392 342 L 452 342" fill="none" stroke="url(#btAccentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <circle cx="452" cy="342" r="7" fill="#0066ff" />

    <!-- Bottom circuit connection -->
    <path d="M 175 402 L 220 447 L 292 447 L 337 402" fill="none" stroke="url(#btAccentGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    <circle cx="256" cy="447" r="6" fill="#0066ff" />

    <!-- ================= MAIN GEOMETRIC '1' AND '0' ================= -->

    <!-- GEOMETRIC '1' (Left side) -->
    <!-- Serif Top + Vertical Body forming sleek digit '1' -->
    <path d="M 105 185
             L 165 125
             L 205 125
             L 205 387
             L 155 387
             L 155 185
             Z"
          fill="url(#btPrimaryGrad)" stroke="#00f2fe" stroke-width="1.5" stroke-linejoin="round" />

    <!-- GEOMETRIC '0' (Right side) - Intertwined Hexagonal Loop -->
    <path d="M 285 125
             L 375 125
             L 435 185
             L 435 327
             L 375 387
             L 285 387
             L 225 327
             L 225 185
             Z
             M 297 175
             L 267 205
             L 267 307
             L 297 337
             L 363 337
             L 393 307
             L 393 205
             L 363 175
             Z"
          fill="url(#btPrimaryGrad)" fill-rule="evenodd" stroke="#00f2fe" stroke-width="1.5" stroke-linejoin="round" />

    <!-- ================= CIRCUIT NODES & INTERCONNECTION BUS ================= -->
    <!-- Connection bridge between '1' and '0' -->
    <path d="M 205 256 L 225 256" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" />

    <!-- Internal Circuit Trace inside '0' loop center -->
    <path d="M 295 256 L 335 256" fill="none" stroke="url(#btAccentGrad)" stroke-width="5" stroke-linecap="round" />
    <circle cx="315" cy="256" r="6" fill="#00f2fe" />

    <!-- Circuit Junction Nodes on key vertices -->
    <circle cx="165" cy="125" r="5" fill="#ffffff" />
    <circle cx="205" cy="125" r="5" fill="#ffffff" />
    <circle cx="285" cy="125" r="5" fill="#ffffff" />
    <circle cx="375" cy="125" r="5" fill="#ffffff" />
    <circle cx="435" cy="185" r="5" fill="#ffffff" />
    <circle cx="435" cy="327" r="5" fill="#ffffff" />
    <circle cx="375" cy="387" r="5" fill="#ffffff" />
    <circle cx="285" cy="387" r="5" fill="#ffffff" />
    <circle cx="225" cy="327" r="5" fill="#ffffff" />

    <!-- Terminal Micro-Nodes -->
    <circle cx="105" cy="185" r="4" fill="#00f2fe" />
    <circle cx="155" cy="387" r="4" fill="#00f2fe" />
    <circle cx="205" cy="387" r="4" fill="#0066ff" />
  </g>
</svg>

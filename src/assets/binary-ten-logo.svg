<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="Binary Ten">
  <title>Binary Ten</title>
  <desc>Monograma "10" construído com trilhas de circuito e códigos binários, em gradiente ciano-azul, adaptado ao tema midnight do site.</desc>

  <defs>
    <!-- Geometria principal do "10" -->
    <linearGradient id="btCore" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#9DFCFF" />
      <stop offset="42%" stop-color="#2CB6F5" />
      <stop offset="100%" stop-color="#0A66E8" />
    </linearGradient>

    <!-- Trilhas de circuito -->
    <linearGradient id="btTrace" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66E8" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#2CB6F5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9DFCFF" />
    </linearGradient>

    <!-- Micro dígitos binários -->
    <linearGradient id="btDigit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9DFCFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#2CB6F5" stop-opacity="0.6" />
    </linearGradient>

    <!-- Brilho ambiente -->
    <radialGradient id="btHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#42DCF0" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#26B2F3" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#26B2F3" stop-opacity="0" />
    </radialGradient>

    <filter id="btGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="btBlur" />
      <feMerge>
        <feMergeNode in="btBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <g id="btDigitOne" fill="none" stroke="url(#btDigit)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -7.5 7.5 L 0 0 L 0 15.5" />
    </g>
    <g id="btDigitZero" fill="none" stroke="url(#btDigit)" stroke-width="4.5">
      <ellipse cx="0" cy="7.5" rx="7.5" ry="11" />
    </g>
  </defs>

  <circle cx="256" cy="256" r="215" fill="url(#btHalo)" />

  <g filter="url(#btGlow)">
    <!-- ============ TRILHAS DE CIRCUITO ============ -->
    <g fill="none" stroke="url(#btTrace)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 312 158 L 312 100 L 356 56 L 432 56" stroke-width="6" />
      <path d="M 400 256 L 468 256" stroke-width="6" />
      <path d="M 312 356 L 312 428 L 362 428" stroke-width="6" />
      <path d="M 384 328 L 434 378 L 476 378" stroke-width="6" />
      <path d="M 84 230 L 52 230 L 34 212" stroke-width="5" />
    </g>

    <!-- Nós terminais -->
    <g fill="#9DFCFF">
      <circle cx="432" cy="56" r="6.5" />
      <circle cx="468" cy="256" r="6.5" />
      <circle cx="362" cy="428" r="6.5" />
      <circle cx="476" cy="378" r="6.5" />
      <circle cx="34" cy="212" r="5.5" />
    </g>

    <!-- ============ MONOGRAMA "10" ============ -->
    <g fill="none" stroke="url(#btCore)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
      <!-- "1": haste vertical + flag diagonal -->
      <path d="M 106 230 L 170 166 L 170 344" />
      <!-- "0": anel segmentado, com abertura voltada para o "1" -->
      <path d="M 229.31 225.9 A 88 88 0 1 1 229.31 286.1" />
    </g>

    <!-- Vias de placa sobre o anel -->
    <g fill="#0A1626" fill-opacity="0.85">
      <circle cx="315.1" cy="168.1" r="5" />
      <circle cx="386.6" cy="209.4" r="5" />
      <circle cx="386.6" cy="302.6" r="5" />
      <circle cx="302.8" cy="343.5" r="5" />
      <circle cx="257.8" cy="325.3" r="5" />
    </g>

    <!-- Códigos binários: "1 0" no núcleo + detalhe nas trilhas -->
    <g opacity="0.5">
      <use href="#btDigitOne" transform="translate(297 240) scale(0.9)" />
      <use href="#btDigitZero" transform="translate(327 240) scale(0.9)" />
      <use href="#btDigitZero" transform="translate(392 88) scale(0.7)" />
      <use href="#btDigitOne" transform="translate(418 88) scale(0.7)" />
    </g>
  </g>
</svg>
